
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci
        
      - name: Create environment file
        env:
          FIREBASE_API_KEY: ${{ secrets.EXPO_PUBLIC_FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_APP_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ secrets.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
          FIREBASE_PROJECT_ID: ${{ secrets.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
        run: |
          printf 'EXPO_PUBLIC_FIREBASE_API_KEY=%s\n' "$FIREBASE_API_KEY" >> .env
          printf 'EXPO_PUBLIC_FIREBASE_APP_ID=%s\n' "$FIREBASE_APP_ID" >> .env
          printf 'EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN=%s\n' "$FIREBASE_AUTH_DOMAIN" >> .env
          printf 'EXPO_PUBLIC_FIREBASE_PROJECT_ID=%s\n' "$FIREBASE_PROJECT_ID" >> .env

      - name: Build Android APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
